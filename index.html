<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixum Clinic v4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .login { text-align: center; padding: 50px; background: white; border-radius: 8px; margin-top: 50px; }
        .login input { padding: 10px; margin: 10px; width: 200px; }
        .login button { padding: 10px 20px; background: #2864f0; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .app { display: none; }
        .section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-field { display: flex; flex-direction: column; }
        .form-field label { font-weight: bold; margin-bottom: 5px; font-size: 12px; }
        .form-field input, .form-field select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { padding: 10px 20px; background: #2864f0; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1e50d8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }
        .hidden { display: none; }
        .alert { background: #d4edda; padding: 15px; border-radius: 5px; margin: 10px 0; }
        nav { background: #2864f0; color: white; padding: 15px; }
        nav button { background: none; border: none; color: white; padding: 10px; cursor: pointer; margin: 0 5px; }
        nav button.active { background: rgba(255,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginDiv" class="login">
        <h2>Fixum Clinic</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Iniciar Sesión</button>
    </div>

    <!-- APP -->
    <div id="appDiv" class="app">
        <nav>
            <button onclick="mostrarModulo('caja')" class="active">💵 CAJA</button>
            <button onclick="mostrarModulo('odontos')">👨‍⚕️ ODONTÓLOGOS</button>
            <button onclick="logout()">Logout</button>
        </nav>

        <!-- CAJA -->
        <div id="moduloCaja" class="section">
            <h2>Registrar Pago de Honorarios</h2>
            <div class="form-row">
                <div class="form-field">
                    <label>Tipo Pago</label>
                    <select id="tipoPago" onchange="actualizarSelectOdonto()">
                        <option value="honorarios">Pago de Honorarios</option>
                        <option value="otro">Otro Egreso</option>
                    </select>
                </div>
                <div class="form-field" id="campoOdonto">
                    <label>Selecciona Odontólogo</label>
                    <select id="selectOdonto" onchange="cargarMontoOdonto()">
                        <option value="">-- Cargando --</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Monto</label>
                    <input type="number" id="monto" placeholder="0">
                </div>
            </div>
            <button class="btn" onclick="pagarHonorarios()">Procesar Pago</button>
        </div>

        <!-- ODONTÓLOGOS -->
        <div id="moduloOdontos" class="section hidden">
            <h2>Odontólogos - Deuda Pendiente</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Ganancia Total</th>
                        <th>Cobrado</th>
                        <th>Deuda Pendiente</th>
                    </tr>
                </thead>
                <tbody id="tablaOdontos"></tbody>
            </table>
        </div>
    </div>

    <script>
        // DATOS
        const datos = {
            usuario: null,
            odontos: [
                {
                    id: 1, 
                    nombre: 'Dr. Alberto Rivera', 
                    historialGanancias: [
                        {fecha: '2026-07-24', ganancia: 5000, cobrado: 0},
                        {fecha: '2026-07-22', ganancia: 5000, cobrado: 5000},
                        {fecha: '2026-07-20', ganancia: 3200, cobrado: 3200}
                    ]
                },
                {
                    id: 2, 
                    nombre: 'Dra. Ana Martínez', 
                    historialGanancias: [
                        {fecha: '2026-07-23', ganancia: 2000, cobrado: 0},
                        {fecha: '2026-07-14', ganancia: 2800, cobrado: 2800}
                    ]
                },
                {
                    id: 3, 
                    nombre: 'Dr. Carlos López', 
                    historialGanancias: [
                        {fecha: '2026-07-15', ganancia: 1500, cobrado: 1500}
                    ]
                }
            ]
        };

        // LOGIN
        function login() {
            const user = document.getElementById('usuario').value;
            if (user) {
                datos.usuario = user;
                document.getElementById('loginDiv').style.display = 'none';
                document.getElementById('appDiv').style.display = 'block';
                actualizarSelectOdonto();
                refrescarTablaOdontos();
            } else {
                alert('Ingresa usuario');
            }
        }

        function logout() {
            datos.usuario = null;
            document.getElementById('loginDiv').style.display = 'block';
            document.getElementById('appDiv').style.display = 'none';
            document.getElementById('usuario').value = '';
            document.getElementById('password').value = '';
        }

        // MÓDULOS
        function mostrarModulo(mod) {
            document.getElementById('moduloCaja').classList.add('hidden');
            document.getElementById('moduloOdontos').classList.add('hidden');
            
            if (mod === 'caja') {
                document.getElementById('moduloCaja').classList.remove('hidden');
            } else if (mod === 'odontos') {
                document.getElementById('moduloOdontos').classList.remove('hidden');
                refrescarTablaOdontos();
            }

            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ODONTÓLOGOS
        function actualizarSelectOdonto() {
            const select = document.getElementById('selectOdonto');
            const tipo = document.getElementById('tipoPago').value;
            
            select.innerHTML = '';

            if (tipo === 'honorarios') {
                document.getElementById('campoOdonto').style.display = 'flex';
                
                // Cargar solo odontólogos con deuda
                let conDeuda = false;
                datos.odontos.forEach(o => {
                    const total = o.historialGanancias.reduce((s, h) => s + h.ganancia, 0);
                    const cobrado = o.historialGanancias.reduce((s, h) => s + h.cobrado, 0);
                    const deuda = total - cobrado;

                    if (deuda > 0) {
                        conDeuda = true;
                        const option = document.createElement('option');
                        option.value = o.id;
                        option.dataset.deuda = deuda;
                        option.textContent = `${o.nombre} - Deuda: $${deuda}`;
                        select.appendChild(option);
                    }
                });

                if (!conDeuda) {
                    const option = document.createElement('option');
                    option.textContent = 'Sin odontólogos con deuda';
                    option.disabled = true;
                    select.appendChild(option);
                }
            } else {
                document.getElementById('campoOdonto').style.display = 'none';
            }
        }

        function cargarMontoOdonto() {
            const select = document.getElementById('selectOdonto');
            const opt = select.options[select.selectedIndex];
            if (opt && opt.dataset.deuda) {
                document.getElementById('monto').value = opt.dataset.deuda;
            }
        }

        function pagarHonorarios() {
            const tipo = document.getElementById('tipoPago').value;
            const monto = parseFloat(document.getElementById('monto').value);

            if (!monto || monto <= 0) {
                alert('Ingresa monto válido');
                return;
            }

            if (tipo === 'honorarios') {
                const odontId = parseInt(document.getElementById('selectOdonto').value);
                if (!odontId) {
                    alert('Selecciona odontólogo');
                    return;
                }

                // Procesar pago
                const odonto = datos.odontos.find(o => o.id === odontId);
                let pendiente = monto;

                for (let reg of odonto.historialGanancias) {
                    const deuda = (reg.ganancia || 0) - (reg.cobrado || 0);
                    if (deuda > 0 && pendiente > 0) {
                        const pago = Math.min(deuda, pendiente);
                        reg.cobrado = (reg.cobrado || 0) + pago;
                        pendiente -= pago;
                    }
                }

                alert(`✅ Pago registrado para ${odonto.nombre}: $${monto}`);
                
                // Limpiar
                document.getElementById('monto').value = '';
                document.getElementById('selectOdonto').value = '';
                
                refrescarTablaOdontos();
                actualizarSelectOdonto();
            }
        }

        function refrescarTablaOdontos() {
            const tbody = document.getElementById('tablaOdontos');
            tbody.innerHTML = '';

            datos.odontos.forEach(o => {
                const total = o.historialGanancias.reduce((s, h) => s + h.ganancia, 0);
                const cobrado = o.historialGanancias.reduce((s, h) => s + h.cobrado, 0);
                const deuda = total - cobrado;

                const row = tbody.insertRow();
                row.innerHTML = `
                    <td><strong>${o.nombre}</strong></td>
                    <td>$${total}</td>
                    <td>$${cobrado}</td>
                    <td style="color: ${deuda > 0 ? 'red' : 'green'}; font-weight: bold;">$${deuda}</td>
                `;
            });
        }
    </script>
</body>
</html>
